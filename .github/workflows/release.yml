name: Publish release APK

on:
  push:
    branches:
      - 'release/v*'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Read release version
        id: version
        run: |
          VERSION_NAME="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)"
          test -n "$VERSION_NAME"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" == release/* ]]; then
            echo "release_tag=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi
      - name: Check tag matches app version
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: test "$RELEASE_TAG" = "v$VERSION_NAME"
      - name: Prepare persistent signing identity
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > signing.p12
          printf '%s' "$RELEASE_STORE_PASSWORD" > signing-passphrase.txt
          printf '%s' "$RELEASE_KEY_PASSWORD" > signing-key-passphrase.txt
          chmod 600 signing.p12 signing-passphrase.txt signing-key-passphrase.txt
      - name: Build and sign release
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          gradle --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app-release-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing.p12 --ks-type PKCS12 --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass file:signing-passphrase.txt \
            --key-pass file:signing-key-passphrase.txt \
            --out "Deeix-Chat-${RELEASE_TAG#v}.apk" app-release-aligned.apk
      - name: Verify signed release
        run: |
          RELEASE_TAG="${{ steps.version.outputs.release_tag }}"
          APK="Deeix-Chat-${RELEASE_TAG#v}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E '^package:|^sdkVersion:|^targetSdkVersion:'
          sha256sum "$APK"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          APK="Deeix-Chat-${RELEASE_TAG#v}.apk"
          gh release create "$RELEASE_TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "Deeix-Chat ${RELEASE_TAG#v}" \
            --notes-file RELEASE_NOTES.md
