name: Export release APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed v1.0.0 from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Deeix-Chat-v1.0.0.apk'
          echo "7044faa48b598f14000a5be8fe9604cc1d80044abd98b434278d1a75bf7af275  Deeix-Chat-v1.0.0.apk" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: Deeix-Chat-v1.0.0-release-apk
          path: Deeix-Chat-v1.0.0.apk
          if-no-files-found: error
          retention-days: 7
