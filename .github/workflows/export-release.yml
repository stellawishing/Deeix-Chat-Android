name: Export release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to export (for example v1.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed release APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Deeix-Chat-${RELEASE_TAG#v}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Deeix-Chat-${{ inputs.tag }}-release-apk
          path: Deeix-Chat-*.apk
          if-no-files-found: error
          retention-days: 7
